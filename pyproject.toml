[project]
name = "comicgan"
version = "1.0.0"
description = "CycleGAN that turns real face photos into comic-style portraits, with a Streamlit app."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "tensorflow>=2.18,<2.21",
    "streamlit>=1.50",
    "numpy",
    "pillow",
]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib", "jupyter"]

[project.scripts]
comicgan-train = "comicgan.train:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["comicgan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
